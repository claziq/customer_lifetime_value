[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "cltv_prediction_pipeline"
version = "0.0.1"
description = "Predictive machine learning pipline for Customer Lifetime Value estimate."
authors = [
  { name = "Yusuf Olarewaju" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "loguru",
    "mkdocs",
    "pip",
    "python-dotenv",
    "ruff",
    "tqdm",
    "typer",
]
requires-python = "~=3.10.0"


[tool.ruff]
line-length = 99
src = ["cltv_prediction_pipeline"]
include = ["pyproject.toml", "cltv_prediction_pipeline/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["cltv_prediction_pipeline"]
force-sort-within-sections = true

